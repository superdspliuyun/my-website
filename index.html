<!-- SEO meta 同步维护：替换 [Your Name] / [Your Role] / [一句话自我介绍] / [username]
     时同步更新 src/data/profile.ts（design D1 + R1 Mitigation）。 -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/my-website/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO 基础（design D1 + D2 + D5） -->
    <title>[Your Name] — [Your Role]</title>
    <meta name="description" content="[一句话自我介绍] | 个人品牌集合站点：作品项目展示、社交身份标签与联系入口（占位字符串由维护者替换，目标是 50–160 字符之间）" />
    <meta name="author" content="[Your Name]" />
    <link rel="canonical" href="https://[username].github.io/my-website/" />

    <!-- OpenGraph（design D1 + spec「OpenGraph 标签」） -->
    <meta property="og:title" content="[Your Name] — [Your Role]" />
    <meta property="og:description" content="[一句话自我介绍] | 个人品牌集合站点：作品项目展示、社交身份标签与联系入口（占位字符串由维护者替换，目标是 50–160 字符之间）" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://[username].github.io/my-website/" />
    <meta property="og:image" content="https://[username].github.io/my-website/og-image.svg" />
    <meta property="og:site_name" content="[Your Name] — 个人品牌站" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card（spec「Twitter Card 标签」） -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="[Your Name] — [Your Role]" />
    <meta name="twitter:description" content="[一句话自我介绍] | 个人品牌集合站点：作品项目展示、社交身份标签与联系入口（占位字符串由维护者替换，目标是 50–160 字符之间）" />
    <meta name="twitter:image" content="https://[username].github.io/my-website/og-image.svg" />

    <script>
      // 必须在 React 渲染前同步执行，避免主题闪烁（spec「刷新后保留偏好」）。
      (function () {
          var s = null;
          try { s = localStorage.getItem('theme'); } catch (e) { s = null; }
          var dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        })();
    </script>
    <script type="module" crossorigin src="/my-website/assets/index-BLq4SI8g.js"></script>
    <link rel="stylesheet" crossorigin href="/my-website/assets/index-BPeacSUy.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
