schema: spec-driven

context: |
  项目：个人品牌站（Personal Website）
  技术栈：React 19 + Vite 8 + TypeScript + Tailwind CSS v4
  部署：GitHub Pages，base path 为 /my-website/
  设计风格：科技感、动态粒子风，支持亮色/暗色主题切换
  性能目标：首屏加载时间小于 2 秒；所有非首屏图片使用 lazy loading

  Language: Simplified Chinese.
  所有 OpenSpec artifacts 必须使用简体中文生成。
  code、API、文件名、命令及其他 code-related terms 使用 English。
  保留 OpenSpec 的结构化 headings 以及 SHALL/MUST 等规范关键词为 English。

rules:
  proposal:
    - 必须明确包含 out-of-scope，说明本次变更不做什么
    - 必须评估变更对现有功能、性能和部署方式的影响
  specs:
    - 使用 Given/When/Then 格式描述交互行为
    - 每个 spec 必须包含至少一个边界或异常场景
  tasks:
    - 每个任务的预计工作量不得超过 30 分钟；超出时必须继续拆分
    - 按 Phase 分组，并明确每个 Phase 的验收条件
    - 每个 Phase 完成后必须暂停，等待用户确认后再进入下一 Phase

operations:
  apply:
    guidance:
      - 严格按 Phase 执行；完成当前 Phase 并报告验证结果后，等待用户确认再继续
